<!DOCTYPE html>
<html lang="en">
<head>

    <meta

    <title>500 - Internal Terminal Error</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/terminal.css') }}"

</head>

<body>

<div class="crt">

        <main class="terminal-output">
            <div class="line system-important">

            <div class="line system-line">

ERROR 500

            <div class="line system-important">

            <div class="line system-line">

            <div class="line system-line">

            </div>

            <div class="line system-line">

            <div class="line eliza-line">
<a class="terminal-link" href="{{ url_for('index') }}">ELIZA&gt; RETURN TO SESSION</a>
